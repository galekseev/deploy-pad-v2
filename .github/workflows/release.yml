name: Release

# Both packages are released together from this repository, from a tag on main.
# Publishing is deliberately gated: nothing reaches the registry until someone
# pushes a `v<major>.<minor>.<patch>` tag, and `workflow_dispatch` defaults to a
# dry run that packs and verifies without publishing.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and verify without publishing
        type: boolean
        default: true

jobs:
  publish:
    name: Publish to the public registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance is the attestation tying a tarball to the workflow run and
      # commit that produced it. npm offers it only for public packages built in
      # CI, and it needs an OIDC token (stack.md §8).
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run test
          pnpm run check:versions
          pnpm run check:traceability

      - name: The tag matches the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(node --print "require('./packages/engine/package.json').version")
          if [ "$tag" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $declared"
            exit 1
          fi

      - name: Build
        run: pnpm run build

      # The last gate: an undeclared dependency or a broken exports map is
      # caught here rather than by the first consumer to install.
      - name: Packed-artifact smoke test
        run: pnpm run check:packed

      - name: Publish
        if: inputs.dry-run != true
        run: pnpm publish --recursive --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
